<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%" fill="none">
  <!-- MindTheSpec: Official Brand Logo (Dark Theme) -->
  <defs>
    <linearGradient id="specGradDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="40%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="lensGradDarkLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#2563FF"/>
    </linearGradient>
    <linearGradient id="lensGradDarkRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563FF"/>
      <stop offset="60%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <filter id="dark-glow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#06B6D4" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#8B5CF6" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Spectacles Brand Mark with Neon Glow -->
  <g transform="translate(12, 12) scale(0.80)" filter="url(#dark-glow)">
    <!-- 3 Idea Sparks radiating from Right Lens -->
    <g stroke-linecap="round">
      <line x1="180" y1="20" x2="180" y2="7" stroke="#C084FC" stroke-width="4.5" />
      <line x1="198" y1="25" x2="210" y2="14" stroke="#F472B6" stroke-width="4.5" />
      <line x1="162" y1="25" x2="152" y2="15" stroke="#38BDF8" stroke-width="4.5" />
    </g>

    <!-- Spectacles Temple Arms -->
    <path d="M 28 72 C 18 72 10 77 4 86" stroke="#06B6D4" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M 222 72 C 232 72 240 77 246 86" stroke="#C084FC" stroke-width="7" stroke-linecap="round" fill="none"/>

    <!-- Nose Bridge -->
    <path d="M 112 70 C 119 60 131 60 138 70" stroke="#38BDF8" stroke-width="7" stroke-linecap="round" fill="none"/>

    <!-- Left Lens: Requirement Document (Neon Cyan-Blue) -->
    <circle cx="70" cy="72" r="42" stroke="url(#lensGradDarkLeft)" stroke-width="7" fill="#0C1527"/>
    <!-- Folded Spec Document -->
    <g>
      <path d="M 54 53 L 73 53 L 85 65 L 85 91 C 85 92.5 83.8 93.5 82.3 93.5 L 56.7 93.5 C 55.2 93.5 54 92.5 54 91 Z" fill="#132247" stroke="#38BDF8" stroke-width="2.6" stroke-linejoin="round"/>
      <!-- Fold corner flap -->
      <path d="M 73 53 L 73 65 L 85 65" fill="#0284C7" stroke="#38BDF8" stroke-width="2.6" stroke-linejoin="round"/>
      <!-- Document Text Lines -->
      <line x1="60" y1="71" x2="77" y2="71" stroke="#38BDF8" stroke-width="2.6" stroke-linecap="round"/>
      <line x1="60" y1="78" x2="79" y2="78" stroke="#38BDF8" stroke-width="2.6" stroke-linecap="round"/>
      <line x1="60" y1="85" x2="72" y2="85" stroke="#38BDF8" stroke-width="2.6" stroke-linecap="round"/>
    </g>

    <!-- Right Lens: Interpretation & Edit (Neon Blue-Violet-Purple) -->
    <circle cx="180" cy="72" r="42" stroke="url(#lensGradDarkRight)" stroke-width="7" fill="#1A132C"/>
    <!-- Notes Lines & Writing Pencil -->
    <g>
      <line x1="160" y1="63" x2="194" y2="63" stroke="#C084FC" stroke-width="3.2" stroke-linecap="round"/>
      <line x1="160" y1="72" x2="196" y2="72" stroke="#C084FC" stroke-width="3.2" stroke-linecap="round"/>
      <line x1="160" y1="81" x2="176" y2="81" stroke="#C084FC" stroke-width="3.2" stroke-linecap="round"/>
      <!-- Angled Pencil Writing on the 3rd line -->
      <g transform="translate(182, 81) rotate(-45)">
        <rect x="0" y="-3.5" width="18" height="7" rx="1.5" fill="#FFE066" stroke="#C084FC" stroke-width="1.8"/>
        <polygon points="18,-3.5 24,0 18,3.5" fill="#F472B6" stroke="#C084FC" stroke-width="1.5"/>
        <polygon points="22.5,-1 24.5,0 22.5,1" fill="#FFFFFF"/>
      </g>
    </g>
  </g>

  <!-- Wordmark: MindTheSpec -->
  <g transform="translate(228, 68)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.8">
      <tspan fill="#FFFFFF">MindThe</tspan><tspan fill="url(#specGradDark)">Spec</tspan>
    </text>
    <!-- Official Brand Tagline -->
    <text y="28" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="600" fill="#CBD5E1" letter-spacing="0.3">
      Different minds. One understanding.
    </text>
  </g>
</svg>
