<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 140" width="100%" height="100%" fill="none">
  <!-- MindTheSpec: Official Spectacles Icon (Light) -->
  <defs>
    <linearGradient id="iconLensLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#2563FF"/>
    </linearGradient>
    <linearGradient id="iconLensRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563FF"/>
      <stop offset="60%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#C026D3"/>
    </linearGradient>
    <filter id="icon-light-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0B1020" flood-opacity="0.1"/>
    </filter>
  </defs>

  <g transform="translate(5, 10)" filter="url(#icon-light-shadow)">
    <!-- 3 Idea Sparks radiating from Right Lens -->
    <g stroke-linecap="round">
      <line x1="180" y1="20" x2="180" y2="7" stroke="#8B5CF6" stroke-width="4.5" />
      <line x1="198" y1="25" x2="210" y2="14" stroke="#A855F7" stroke-width="4.5" />
      <line x1="162" y1="25" x2="152" y2="15" stroke="#2563FF" stroke-width="4.5" />
    </g>

    <!-- Spectacles Temple Arms -->
    <path d="M 28 72 C 18 72 10 77 4 86" stroke="#06B6D4" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M 222 72 C 232 72 240 77 246 86" stroke="#C026D3" stroke-width="7" stroke-linecap="round" fill="none"/>

    <!-- Nose Bridge -->
    <path d="M 112 70 C 119 60 131 60 138 70" stroke="#2563FF" stroke-width="7" stroke-linecap="round" fill="none"/>

    <!-- Left Lens: Spec Document -->
    <circle cx="70" cy="72" r="42" stroke="url(#iconLensLeft)" stroke-width="7" fill="#F0F9FF"/>
    <g>
      <path d="M 54 53 L 73 53 L 85 65 L 85 91 C 85 92.5 83.8 93.5 82.3 93.5 L 56.7 93.5 C 55.2 93.5 54 92.5 54 91 Z" fill="#FFFFFF" stroke="#0284C7" stroke-width="2.6" stroke-linejoin="round"/>
      <path d="M 73 53 L 73 65 L 85 65" fill="#BAE6FD" stroke="#0284C7" stroke-width="2.6" stroke-linejoin="round"/>
      <line x1="60" y1="71" x2="77" y2="71" stroke="#0284C7" stroke-width="2.6" stroke-linecap="round"/>
      <line x1="60" y1="78" x2="79" y2="78" stroke="#0284C7" stroke-width="2.6" stroke-linecap="round"/>
      <line x1="60" y1="85" x2="72" y2="85" stroke="#0284C7" stroke-width="2.6" stroke-linecap="round"/>
    </g>

    <!-- Right Lens: Notes & Pencil -->
    <circle cx="180" cy="72" r="42" stroke="url(#iconLensRight)" stroke-width="7" fill="#FAF5FF"/>
    <g>
      <line x1="160" y1="63" x2="194" y2="63" stroke="#8B5CF6" stroke-width="3.2" stroke-linecap="round"/>
      <line x1="160" y1="72" x2="196" y2="72" stroke="#8B5CF6" stroke-width="3.2" stroke-linecap="round"/>
      <line x1="160" y1="81" x2="176" y2="81" stroke="#8B5CF6" stroke-width="3.2" stroke-linecap="round"/>
      <g transform="translate(182, 81) rotate(-45)">
        <rect x="0" y="-3.5" width="18" height="7" rx="1.5" fill="#FFE066" stroke="#8B5CF6" stroke-width="1.8"/>
        <polygon points="18,-3.5 24,0 18,3.5" fill="#FF8FB8" stroke="#8B5CF6" stroke-width="1.5"/>
        <polygon points="22.5,-1 24.5,0 22.5,1" fill="#7A1F3D"/>
      </g>
    </g>
  </g>
</svg>
